services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securelog
      POSTGRES_USER: securelog
      POSTGRES_PASSWORD: securelog_local_only
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - securelog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U securelog -d securelog']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  securelog_pg:
